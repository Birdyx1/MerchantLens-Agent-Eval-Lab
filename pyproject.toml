[project]
name = "agent-eval"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4,<5",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "mcp>=2.3.0",
    "path>=17.1.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
